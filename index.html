<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DistritoVet Prototipo</title>
<style>
  :root{
    --bg:#ecebf3; --ink:#2b2a4c; --muted:#6b6a85; --chip:#ffffff; --chip-ink:#2b2a4c; --accent:#312d63; --ring:rgba(49,45,99,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0e1220; --ink:#e9e9f3; --muted:#9a9bb5; --chip:#1b2135; --chip-ink:#e9e9f3; --accent:#6a5fd8; --ring:rgba(106,95,216,.3); }
  }
  :root[data-theme="dark"]{ --bg:#0e1220; --ink:#e9e9f3; --muted:#9a9bb5; --chip:#1b2135; --chip-ink:#e9e9f3; --accent:#6a5fd8; --ring:rgba(106,95,216,.3); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;gap:20px;overflow-x:hidden;transition:background .4s}
  header{text-align:center;max-width:520px}
  header h1{font-size:20px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .controls button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--ring);background:var(--chip);color:var(--chip-ink);
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:transform .15s, box-shadow .15s}
  .controls button:hover{box-shadow:0 0 0 3px var(--ring)}
  .controls button:active{transform:scale(.97)}
  .controls button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}

  /* iPhone 14 Pro: 393 x 852 */
  .stage{--s:1; width:calc(417px * var(--s)); height:calc(876px * var(--s)); position:relative}
  .phone{position:absolute;left:0;top:0;width:417px;height:876px;transform:scale(var(--s));transform-origin:0 0;
    border-radius:64px;background:linear-gradient(145deg,#4a4a52,#1c1c20 40%,#2e2e34);padding:12px;
    box-shadow:0 0 0 2px #0b0b0d inset, 0 30px 60px -20px rgba(10,10,30,.45), 0 12px 24px -12px rgba(10,10,30,.35)}
  .phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#2a2a30}
  .phone::before{left:-3px;top:178px;height:62px;box-shadow:0 80px 0 #2a2a30}
  .phone::after{right:-3px;top:230px;height:96px}
  .screen{position:relative;width:393px;height:852px;border-radius:52px;overflow:hidden;background:#000;isolation:isolate}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:50;pointer-events:none}

  .view{position:absolute;inset:0;overflow:hidden;background:#fff;will-change:transform}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
  .scroll::-webkit-scrollbar{display:none}
  .view .canvas{position:relative;width:393px}
  .view .canvas img{display:block;width:393px;height:auto;user-select:none;-webkit-user-drag:none}
  .fixed-top,.fixed-bottom{position:absolute;left:0;width:393px;background-repeat:no-repeat;background-size:393px auto;z-index:5;pointer-events:none}
  .fixed-top{top:0;height:100px;background-position:0 0}
  .fixed-bottom{bottom:0;height:30px;background-position:0 100%}
  .hot{position:absolute;border-radius:10px;cursor:pointer;z-index:6;-webkit-tap-highlight-color:transparent}
  .hot.top{position:absolute}
  .hint .hot, .flash .hot{background:rgba(64,140,255,.22);outline:2px solid rgba(64,140,255,.75)}
  .flash .hot{animation:flash .7s ease}
  @keyframes flash{from{opacity:1}to{opacity:0}}

  .enter-fwd{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}
  .leave-fwd{animation:outL .38s cubic-bezier(.2,.8,.2,1) both}
  .enter-back{animation:inL .38s cubic-bezier(.2,.8,.2,1) both}
  .leave-back{animation:outR .38s cubic-bezier(.2,.8,.2,1) both}
  .enter-fade{animation:fadeIn .45s ease both}
  .leave-fade{animation:fadeOut .45s ease both}
  @keyframes inR{from{transform:translateX(100%)}to{transform:none}}
  @keyframes outL{from{transform:none}to{transform:translateX(-28%);filter:brightness(.85)}}
  @keyframes inL{from{transform:translateX(-28%);filter:brightness(.85)}to{transform:none}}
  @keyframes outR{from{transform:none}to{transform:translateX(100%)}}
  @keyframes fadeIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  .leave-fwd,.leave-fade{z-index:1}.enter-fwd,.enter-back,.enter-fade{z-index:2}.leave-back{z-index:3}
  @media (prefers-reduced-motion: reduce){ .enter-fwd,.leave-fwd,.enter-back,.leave-back,.enter-fade,.leave-fade{animation-duration:.01s} }

  .progress{display:flex;gap:6px;justify-content:center}
  .progress i{width:6px;height:6px;border-radius:3px;background:var(--ring);transition:all .3s}
  .progress i.on{width:18px;background:var(--accent)}
  .caption{font-size:13px;color:var(--muted);min-height:18px;text-align:center}

  body.embed{padding:0;gap:0;background:transparent}
  body.embed header, body.embed .controls, body.embed .caption, body.embed .progress{display:none}
</style>
</head>
<body>
<header>
  <h1>DistritoVet · Solicitud de crédito</h1>
  <p>Prototipo interactivo. Tocá los botones de cada pantalla para avanzar, como en la app.</p>
</header>
<div class="controls">
  <button id="bLight" aria-pressed="true">Modo claro</button>
  <button id="bDark" aria-pressed="false">Modo oscuro</button>
  <button id="bHint" aria-pressed="false">Ver zonas clicables</button>
  <button id="bReset">Reiniciar</button>
</div>
<div class="stage" id="stage">
  <div class="phone"><div class="screen" id="screen"><div class="island"></div></div></div>
</div>
<div class="progress" id="progress"></div>
<div class="caption" id="caption"></div>

<script>
const IMG = {
 "d_aprobada": "pantallas/d_aprobada.png",
 "d_carrito": "pantallas/d_carrito.png",
 "d_creditos": "pantallas/d_creditos.png",
 "d_enviada": "pantallas/d_enviada.png",
 "d_estado": "pantallas/d_estado.png",
 "d_form": "pantallas/d_form.png",
 "d_revision": "pantallas/d_revision.png",
 "d_seleccionado": "pantallas/d_seleccionado.png",
 "d_sobre": "pantallas/d_sobre.png",
 "d_tyc": "pantallas/d_tyc.png",
 "d_tyc_ok": "pantallas/d_tyc_ok.png",
 "l_aprobada": "pantallas/l_aprobada.png",
 "l_carrito": "pantallas/l_carrito.png",
 "l_creditos": "pantallas/l_creditos.png",
 "l_enviada": "pantallas/l_enviada.png",
 "l_estado": "pantallas/l_estado.png",
 "l_form": "pantallas/l_form.png",
 "l_revision": "pantallas/l_revision.png",
 "l_seleccionado": "pantallas/l_seleccionado.png",
 "l_sobre": "pantallas/l_sobre.png",
 "l_tyc": "pantallas/l_tyc.png",
 "l_tyc_ok": "pantallas/l_tyc_ok.png"
};
const H = {carrito:1188,sobre:850,form:989,revision:1064,creditos:994,seleccionado:994,tyc:2669,tyc_ok:2669,enviada:852,estado:850,aprobada:850};
const BACK = {x:8,y:48,w:52,h:48};
// hotspots: [x,y,w,h,target]  target "back" = volver
const SCREENS = {
  carrito:{cap:"1. Carrito de compras: elegí financiar con crédito", spots:[[30,798,334,46,'sobre'],[28,996,338,48,'sobre'],[14,1064,366,56,'sobre'],[164,570,140,24,'sobre']]},
  sobre:{cap:"2. Sobre créditos", spots:[[22,658,350,54,'creditos'],[22,718,350,54,'back']]},
  creditos:{cap:"3. Elegí cómo financiar tus compras", spots:[[14,426,366,200,'seleccionado'],[178,834,152,26,'tyc']]},
  seleccionado:{cap:"4. Crédito Flex seleccionado", spots:[[14,904,366,60,'tyc'],[10,838,40,40,'tyc'],[178,836,152,26,'tyc']]},
  tyc:{cap:"5. Términos y condiciones: aceptalos para seguir", spots:[[14,2480,360,34,'tyc_ok']]},
  tyc_ok:{cap:"6. Términos aceptados", spots:[[14,2536,366,58,'form'],[14,2480,360,34,'tyc']]},
  form:{cap:"7. Formulario de solicitud", spots:[[14,862,366,58,'revision']]},
  revision:{cap:"8. Revisión y confirmación", spots:[[14,935,366,58,'enviada']]},
  enviada:{cap:"9. Solicitud enviada", spots:[[14,657,366,56,'estado'],[14,725,366,56,'carrito']]},
  estado:{cap:"10. Solicitud en revisión (se aprueba sola en unos segundos)", spots:[[14,122,366,184,'aprobada'],[14,725,366,56,'carrito']], auto:['aprobada',3200]},
  aprobada:{cap:"11. ¡Crédito aprobado!", spots:[[14,661,366,56,'carrito'],[14,725,366,56,'carrito']]}
};
const ORDER = ['carrito','sobre','creditos','seleccionado','tyc','tyc_ok','form','revision','enviada','estado','aprobada'];

let mode='l', current=null, history=[], timer=null, hint=false;
const screen=document.getElementById('screen');

function build(name){
  const v=document.createElement('div'); v.className='view'; v.dataset.name=name;
  const c=document.createElement('div'); c.className='canvas';
  const img=new Image(); img.src=IMG[mode+'_'+name]; img.alt=''; img.draggable=false; c.appendChild(img);
  const def=SCREENS[name];
  def.spots.forEach(([x,y,w,h,t])=>c.appendChild(spot(x,y,w,h,t)));
  const sc=document.createElement('div'); sc.className='scroll'; sc.appendChild(c); v.appendChild(sc);
  if(H[name]>852){
    const ft=document.createElement('div'); ft.className='fixed-top'; ft.style.backgroundImage=`url(${IMG[mode+'_'+name]})`; v.appendChild(ft);
    const fb=document.createElement('div'); fb.className='fixed-bottom'; fb.style.backgroundImage=`url(${IMG[mode+'_'+name]})`; v.appendChild(fb);
  }
  if(name!=='carrito'){ const b=spot(BACK.x,BACK.y,BACK.w,BACK.h,'back'); b.style.position='absolute'; b.classList.add('top'); v.appendChild(b); }
  v.addEventListener('click',e=>{ if(!e.target.classList.contains('hot')){ v.classList.add('flash'); setTimeout(()=>v.classList.remove('flash'),700);} });
  if(hint) v.classList.add('hint');
  return v;
}
function spot(x,y,w,h,t){
  const d=document.createElement('div'); d.className='hot';
  Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  d.addEventListener('click',e=>{e.stopPropagation(); t==='back'?back():go(t);});
  return d;
}
function show(name,dir){
  clearTimeout(timer);
  const old=screen.querySelector('.view:not(.leaving)');
  const v=build(name); screen.appendChild(v);
  if(old && dir){
    old.classList.add('leaving', dir==='back'?'leave-back':dir==='fade'?'leave-fade':'leave-fwd');
    v.classList.add(dir==='back'?'enter-back':dir==='fade'?'enter-fade':'enter-fwd');
    setTimeout(()=>{old.remove(); v.classList.remove('enter-fwd','enter-back','enter-fade');},460);
  } else if(old){ old.remove(); }
  current=name;
  const def=SCREENS[name];
  if(def.auto){ timer=setTimeout(()=>{ if(current===name) go(def.auto[0],'fade'); }, def.auto[1]); }
  document.getElementById('caption').textContent=def.cap;
  const i=ORDER.indexOf(name);
  document.querySelectorAll('#progress i').forEach((el,k)=>el.classList.toggle('on',k===i));
}
function go(name,dir='fwd'){
  if(name==='carrito'){ history=[]; show(name, current==='carrito'?null:'fade'); return; }
  history.push(current); show(name,dir);
}
function back(){ if(!history.length) return; show(history.pop(),'back'); }
function setMode(m){
  mode=m; document.documentElement.dataset.theme = m==='d'?'dark':'light';
  bLight.setAttribute('aria-pressed',m==='l'); bDark.setAttribute('aria-pressed',m==='d');
  const st=screen.querySelector('.view:not(.leaving)'); const sc=st?st.querySelector('.scroll').scrollTop:0;
  show(current,null); screen.querySelector('.view .scroll').scrollTop=sc;
}
document.getElementById('progress').innerHTML=ORDER.map(()=>'<i></i>').join('');
bLight.onclick=()=>setMode('l'); bDark.onclick=()=>setMode('d');
bHint.onclick=()=>{hint=!hint; bHint.setAttribute('aria-pressed',hint); screen.querySelectorAll('.view').forEach(v=>v.classList.toggle('hint',hint));};
bReset.onclick=()=>{history=[]; show('carrito','fade');};

// scale to fit viewport
function fit(){
  const embed=document.body.classList.contains('embed');
  const availH=window.innerHeight-(embed?0:230), availW=window.innerWidth-(embed?0:32);
  const s=Math.min(1, availH/876, availW/417);
  document.getElementById('stage').style.setProperty('--s', Math.max(.45,s).toFixed(3));
}
const q=new URLSearchParams(location.search);
if(q.has('embed')) document.body.classList.add('embed');
if(q.get('modo')==='oscuro') mode='d';
document.documentElement.dataset.theme = mode==='d'?'dark':'light';
bLight.setAttribute('aria-pressed',mode==='l'); bDark.setAttribute('aria-pressed',mode==='d');
window.addEventListener('resize',fit); fit();
// preload
Object.values(IMG).forEach(src=>{const i=new Image(); i.src=src;});
show('carrito',null);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'||e.key==='Backspace') back(); });
</script>
</body>
</html>
